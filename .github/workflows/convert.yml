name: Convert Pack

on:
  push:
    branches: [ main, master ]

jobs:
  packsquash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Pack
        run: unzip -q "pack.zip" -d extracted_pack

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v0.4
        with:
          options_file: packsquash.toml

      - name: Upload converted pack
        uses: actions/upload-artifact@v4
        with:
          name: converted-mcpack
          path: build/pack.mcpack
