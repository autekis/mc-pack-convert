name: Convert Pack

on:
  push:
    branches: [ main, master ]

jobs:
  packsquash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Pack
        run: |
          unzip -q "pack.zip" -d temp_unzip
          # pack.mcmeta の場所を探して extracted_pack 直下に移動
          MCMETA_PATH=$(find temp_unzip -name "pack.mcmeta" | head -n 1)
          if [ -z "$MCMETA_PATH" ]; then
            echo "ERROR: pack.mcmeta が zip 内に見つかりません。"
            exit 1
          fi
          MCMETA_DIR=$(dirname "$MCMETA_PATH")
          mkdir -p extracted_pack
          cp -r "$MCMETA_DIR"/* extracted_pack/

      - name: Install & Run PackSquash
        run: |
          curl -sSL https://github.com/PackSquash/PackSquash/releases/latest/download/packsquash-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x packsquash
          ./packsquash packsquash.toml

      - name: Upload converted pack
        uses: actions/upload-artifact@v4
        with:
          name: converted-mcpack
          path: build/pack.mcpack
