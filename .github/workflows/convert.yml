name: Convert Pack

on:
  push:
    branches: [ main, master ]

jobs:
  packsquash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Pack
        run: |
          mkdir -p extracted_pack build
          unzip -q "pack.zip" -d extracted_pack
          
          # もし extracted_pack 直下にフォルダが1つだけポツンとある場合はその中身を上階層に引き上げる
          if [ $(ls -1 extracted_pack | wc -l) -eq 1 ] && [ -d extracted_pack/* ]; then
            mv extracted_pack/*/* extracted_pack/ 2>/dev/null || true
          fi

      - name: Install & Run PackSquash
        run: |
          curl -sSL https://github.com/PackSquash/PackSquash/releases/latest/download/packsquash-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x packsquash
          ./packsquash packsquash.toml

      - name: Upload converted pack
        uses: actions/upload-artifact@v4
        with:
          name: converted-mcpack
          path: build/pack.mcpack
